<!-- The Fourth Sheet wordmark: green "4th" mark + "The Fourth Sheet". For print, email signatures and documents. Uses Roboto. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" role="img" aria-label="The Fourth Sheet">
  <rect x="0" y="4" width="64" height="64" rx="14" fill="#2f7a5d"/>
  <text x="29" y="50" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#fbfdf9" text-anchor="middle">4<tspan font-size="16" dy="-15" font-weight="700">th</tspan></text>
  <text x="84" y="49" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#25342a">The Fourth Sheet</text>
</svg>
