     (#2f7a5d). mark-4th-32.png and mark-4th-180.png are PNG copies (browser tab and phone home-screen icons). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#2f7a5d"/>
  <text x="29" y="46" font-family="Roboto, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#fbfdf9" text-anchor="middle">4<tspan font-size="16" dy="-15" font-weight="700">th</tspan></text>
</svg>
