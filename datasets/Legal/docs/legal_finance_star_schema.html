<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  DIM_CLIENT ||--o{ DIM_MATTER : owns
  DIM_PRACTICE_AREA ||--o{ DIM_MATTER : categorizes
  DIM_FEE_EARNER ||--o{ DIM_MATTER : handles
  DIM_REFERRAL_SOURCE ||--o{ DIM_MATTER : "sourced via"
  DIM_MATTER ||--o{ FACT_WORK_PERFORMED : records
  DIM_FEE_EARNER ||--o{ FACT_WORK_PERFORMED : "logs hours"
  DIM_DATE ||--o{ FACT_WORK_PERFORMED : "worked on"
  FACT_WORK_PERFORMED ||--o{ FACT_BILLING : billed
  DIM_MATTER ||--o{ FACT_BILLING : invoiced
  DIM_FEE_EARNER ||--o{ FACT_BILLING : authored
  DIM_MATTER ||--o{ FACT_DISBURSEMENTS : incurs
  DIM_FEE_EARNER ||--o{ FACT_FEE_EARNER_BUDGET_MONTHLY : budgeted
  DIM_DATE ||--o{ FACT_FEE_EARNER_BUDGET_MONTHLY : "budget month"

  DIM_CLIENT {
    int client_id PK
    string client_name
    string client_segment
  }
  DIM_MATTER {
    int matter_id PK
    int client_id FK
    string matter_reference
    string matter_name
    int practice_area_id FK
    string practice_area_name
    int fee_earner_id FK
    int referral_source_id FK
    date open_date
    date close_date
    string status
    string fee_type
  }
  DIM_PRACTICE_AREA {
    int practice_area_id PK
    string practice_area_name
    int avg_duration_months
    float nwnf_share
  }
  DIM_FEE_EARNER {
    int fee_earner_id PK
    string name
    string role
    int primary_practice_area_id FK
    int hourly_rate
    float target_utilization_pct
  }
  DIM_REFERRAL_SOURCE {
    int referral_source_id PK
    string source_name
    float quality_factor
  }
  DIM_DATE {
    date date PK
    int year
    int month
    string financial_year
  }
  FACT_WORK_PERFORMED {
    int timecard_id PK
    int matter_id FK
    date work_date
    date ledger_date
    int fee_earner_id FK
    float hours_worked
    float work_value_generated
    string narrative
  }
  FACT_BILLING {
    int billing_id PK
    int timecard_id FK
    int matter_id FK
    date billing_date
    date ledger_date
    string invoice_number
    int fee_earner_id FK
    float billed_hours
    float billed_rate
    float billed_amount
    float writeoff_amount
    string billing_status
    string billing_narrative
  }
  FACT_DISBURSEMENTS {
    int disbursement_id PK
    int matter_id FK
    date disbursement_date
    date ledger_date
    string invoice_number
    string disbursement_narrative
    float disbursement_amount
  }
  FACT_FEE_EARNER_BUDGET_MONTHLY {
    int budget_id PK
    int fee_earner_id FK
    int practice_area_id FK
    int year
    int month
    float budget_hours
    float budget_revenue
  }
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
