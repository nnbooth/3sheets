  <text x="29" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#fbfdf9" text-anchor="middle">4<tspan font-size="16" dy="-15" font-weight="700">th</tspan></text>
</svg>
