<!-- The Fourth Sheet wordmark: green "4S" mark + name. For print, email
     signatures and documents. Uses Inter (falls back to Helvetica/Arial). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" role="img" aria-label="The Fourth Sheet">
  <rect x="0" y="4" width="64" height="64" rx="14" fill="#2f7a5d"/>
  <text x="32" y="47" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fbfdf9" text-anchor="middle" letter-spacing="-1">4S</text>
  <text x="84" y="49" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#25342a">The Fourth Sheet</text>
</svg>
