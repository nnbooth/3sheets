  <rect width="640" height="360" fill="#25342a"/>
  <!-- pixel ground -->
  <g fill="#2f7a5d">
    <rect y="296" width="640" height="64"/>
  </g>
  <g fill="#3f9a75">
    <rect x="0" y="296" width="640" height="8"/>
