  <text x="320" y="48" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#fbfdf9" text-anchor="middle">THE MONTH-END RUN</text>
  <text x="320" y="338" font-family="Courier New, monospace" font-size="14" fill="#eaf6ee" text-anchor="middle">POSTER COMING SOON</text>
