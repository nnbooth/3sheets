<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Fourth Sheet: old versions</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --accent: #2f7a5d;
    --accent-soft: #e8f3ee;
    --stage: #e4e4e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --panel: #18181b;
      --text: #fafafa;
      --muted: #a1a1aa;
      --border: #27272a;
      --accent: #4fb58c;
      --accent-soft: #14281f;
      --stage: #111113;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-columns: 290px 1fr;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
  }

  /* ---------- Sidebar ---------- */
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  header { padding: 20px 20px 12px; }
  h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

  nav { flex: 1; overflow-y: auto; padding: 8px 10px 16px; }
  .group { margin: 14px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  nav button {
    display: block;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--accent-soft); }
  nav button[aria-current="true"] .name { color: var(--accent); }
  .name { display: block; font-weight: 600; }
  .desc { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }

  footer { padding: 12px 20px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.5; }
  kbd { padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; font: 11px ui-monospace, Menlo, monospace; }

  /* ---------- Viewer ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .toolbar .title { font-weight: 600; margin-right: auto; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button, .toolbar a, .toolbar .btn {
    padding: 6px 12px;
    border: 0;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .toolbar a, .toolbar .btn { border: 1px solid var(--border); border-radius: 8px; }
  .toolbar a:hover, .toolbar .btn:hover { background: var(--bg); }

  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 16px; background: var(--stage); overflow: auto; }
  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    transition: width 0.2s ease;
  }
  .stage.phone iframe { width: 390px; flex: none; }

  /* ---------- Narrow screens ---------- */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 10px 10px; }
    nav .group, footer, header p { display: none; }
    nav button { flex: none; width: auto; white-space: nowrap; }
    .desc, .branch { display: none; }
    .stage { padding: 8px; }
    .stage.phone iframe { width: 100%; }
  }
</style>
</head>
<body>
  <aside>
    <header>
      <h1>The Fourth Sheet: old versions</h1>
      <p>Every version of the site, side by side. Pick one to preview it.</p>
    </header>
    <nav id="list" aria-label="Versions"></nav>
    <footer>
      <kbd>&uarr;</kbd> <kbd>&darr;</kbd> switch version &middot; <kbd>P</kbd> phone / desktop<br />
      Each version is also a branch in your GitHub repo (shown in grey).
    </footer>
  </aside>

  <main>
    <div class="toolbar">
      <span class="title" id="title"></span>
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" id="desk" aria-pressed="true">Desktop</button>
        <button type="button" id="phone" aria-pressed="false">Phone</button>
      </div>
      <button type="button" class="btn" id="reload">Reload</button>
      <a id="open" href="#" target="_blank" rel="noopener">Open in new tab &nearr;</a>
    </div>
    <div class="stage" id="stage">
      <iframe id="view" title="Site preview"></iframe>
    </div>
  </main>

<script>
  const VERSIONS = [
    { group: 'Current' },
    { id: 'main',      name: 'Live site (main)',     desc: 'What is on the web now.', path: '../index.html', branch: 'main' },
    { group: 'Themes' },
    { id: 'modern',    name: 'Modern',               desc: 'Clean, neutral, best-practice. Light and dark.', path: 'modern/index.html', branch: 'modern-theme' },
    { id: 'apple',     name: 'Apple style',          desc: 'Frosted nav, black and grey tiles, blue pills.', path: 'apple/index.html', branch: 'apple-theme' },
    { id: 'social',    name: 'Facebook style',       desc: 'Business page, sections as feed posts.', path: 'social/index.html', branch: 'social-theme' },
    { id: 'insta',     name: 'Instagram style',      desc: 'Mobile profile, story highlights, carousels. Try Phone.', path: 'insta/index.html', branch: 'insta-theme', phone: true },
    { group: 'Retro' },
    { id: 'nes',       name: '8-bit (with game)',    desc: 'Toned-down 8-bit office look. Game opens from the filing cabinet in the footer.', path: 'nes/index.html', branch: 'nes-theme' },
    { id: 'game',      name: 'The Month-End Run',    desc: 'The game on its own.', path: 'nes/game.html', branch: 'nes-theme' },
    { id: 'snes',      name: '16-bit',               desc: 'Super Mario World style.', path: 'snes/index.html', branch: 'snes-theme' },
    { id: 'sms',       name: 'Master System',        desc: 'Alex Kidd style.', path: 'sms/index.html', branch: 'sms-theme' },
    { id: 'geocities', name: 'GeoCities',            desc: 'Welcome 2 my homepage.', path: 'geocities/index.html', branch: 'geocities-theme' },
    { id: 'as400',     name: 'AS/400 terminal',      desc: 'Green on black. Your original CSS.', path: 'as400/index.html', branch: 'as400-theme' },
  ];
  const items = VERSIONS.filter(v => v.id);

  const list = document.getElementById('list');
  const view = document.getElementById('view');
  const stage = document.getElementById('stage');
  const title = document.getElementById('title');
  const open = document.getElementById('open');
  const desk = document.getElementById('desk');
  const phone = document.getElementById('phone');

  // Build the sidebar
  const buttons = {};
  for (const v of VERSIONS) {
    if (v.group) {
      const g = document.createElement('div');
      g.className = 'group';
      g.textContent = v.group;
      list.appendChild(g);
      continue;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="name"></span><span class="desc"></span><span class="branch"></span>`;
    b.querySelector('.name').textContent = v.name;
    b.querySelector('.desc').textContent = v.desc;
    b.querySelector('.branch').textContent = v.branch;
    b.addEventListener('click', () => show(v.id));
    list.appendChild(b);
    buttons[v.id] = b;
  }

  let current = null;

  function setPhone(on) {
    stage.classList.toggle('phone', on);
    phone.setAttribute('aria-pressed', String(on));
    desk.setAttribute('aria-pressed', String(!on));
  }

  function show(id) {
    const v = items.find(x => x.id === id) || items[0];
    current = v.id;
    for (const [k, b] of Object.entries(buttons)) b.setAttribute('aria-current', String(k === v.id));
    title.textContent = v.name;
    view.src = v.path;
    open.href = v.path;
    if (v.phone) setPhone(true);
    try { localStorage.setItem('3s-versions-last', v.id); } catch (e) { /* ignore */ }
    if (location.hash !== '#' + v.id) history.replaceState(null, '', '#' + v.id);
    buttons[v.id].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function step(dir) {
    const i = items.findIndex(x => x.id === current);
    show(items[(i + dir + items.length) % items.length].id);
  }

  desk.addEventListener('click', () => setPhone(false));
  phone.addEventListener('click', () => setPhone(true));
  document.getElementById('reload').addEventListener('click', () => { view.src = view.src; });

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'p' || e.key === 'P') setPhone(!stage.classList.contains('phone'));
  });

  // Start on the version in the URL, else the last one viewed, else the live site
  let start = location.hash.slice(1);
  if (!items.some(x => x.id === start)) {
    try { start = localStorage.getItem('3s-versions-last'); } catch (e) { start = null; }
  }
  show(start || 'main');
</script>
</body>
</html>
