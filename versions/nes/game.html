<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Fourth Sheet: The Month-End Run</title>
  <meta name="description" content="The Fourth Sheet: The Month-End Run. A tiny 8-bit side-scroller. Standalone test page." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --black: #000000;
      --white: #fcfcfc;
      --sky: #a4e4fc;
      --gold: #f8b800;
      --red: #d82800;
      --red-dark: #881400;
      --font: 'Press Start 2P', 'Courier New', monospace;
      --px: 4px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      overflow: hidden;
    }

    .game-wrap { width: 100%; max-width: 1600px; }

    #game-canvas {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--sky);
      border: var(--px) solid var(--white);
      cursor: pointer;
      touch-action: manipulation;
    }

    #game-canvas:focus { outline: none; }
    #game-canvas:focus-visible { outline: var(--px) dashed var(--gold); outline-offset: 6px; }

    .game-help { margin: 16px 0 0; font-size: 8px; text-align: center; color: #bcbcbc; line-height: 2; }
    .game-help a { color: var(--gold); }
    .embedded .game-help a, .embedded .game-help br { display: none; }

    .game-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 0;
      font-size: 10px;
    }

    .game-name input {
      width: 13ch;
      padding: 8px 10px;
      font-family: var(--font);
      font-size: 12px;
      text-transform: uppercase;
      color: var(--white);
      background: var(--black);
      border: var(--px) solid var(--white);
      border-radius: 0;
      outline: none;
    }

    .sound-toggle {
      padding: 8px 10px;
      font-family: var(--font);
      font-size: 10px;
      color: var(--white);
      background: var(--black);
      border: var(--px) solid var(--white);
      cursor: pointer;
    }
    .sound-toggle[aria-pressed="false"] { color: #7c7c7c; border-color: #7c7c7c; }

    .game-name input::placeholder { color: #7c7c7c; }
    .game-name input:focus { border-color: var(--gold); }

    .game-touch { display: none; }

    @media (pointer: coarse) {
      .game-touch {
        display: grid;
        grid-template-columns: 64px 64px 1fr 64px;
        grid-template-areas: "left right check jump";
        gap: 10px;
        margin: 16px auto 0;
        max-width: 560px;
        user-select: none;
        -webkit-user-select: none;
      }
      .game-touch button {
        height: 64px;
        font-family: var(--font);
        font-size: 16px;
        color: var(--white);
        background: var(--black);
        border: var(--px) solid var(--white);
        touch-action: none;
      }
      .game-touch [data-key="left"] { grid-area: left; }
      .game-touch [data-key="right"] { grid-area: right; }
      .game-touch [data-key="check"] { grid-area: check; font-size: 10px; background: #007800; }
      .game-touch [data-key="jump"] { grid-area: jump; border-radius: 50%; background: var(--red); }
      .game-touch .is-down { transform: translateY(var(--px)); filter: brightness(0.8); }
      .game-help { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <canvas id="game-canvas" width="256" height="240" tabindex="0" data-fit="screen" data-reserve="160"
      aria-label="The Fourth Sheet: The Month-End Run: a small side-scrolling game. Click or press Enter to start."></canvas>
    <div class="game-name">
      <label for="player-name">NAME</label>
      <input id="player-name" type="text" maxlength="8" autocomplete="nickname" autocapitalize="characters"
        spellcheck="false" placeholder="PLAYER" enterkeyhint="go" />
      <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="true">SOUND ON</button>
    </div>
    <div class="game-touch" aria-hidden="true">
      <button type="button" tabindex="-1" data-key="left">&#9664;</button>
      <button type="button" tabindex="-1" data-key="right">&#9654;</button>
      <button type="button" tabindex="-1" data-key="check">C APPROVE</button>
      <button type="button" tabindex="-1" data-key="jump">A</button>
    </div>
    <p class="game-help">
      Left/Right move &middot; Z or Space jump &middot; C approve &middot; P pause &middot; M sound<br />
      <a href="index.html">Back to the site</a>
    </p>
  </main>
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
  <script src="game-audio.js"></script>
  <script src="game.js"></script>
  <script>
    // Standalone page: focus the game straight away so keys work.
    document.getElementById('game-canvas').focus({ preventScroll: true });

    // Sound on/off button (same as the M key)
    (() => {
      const btn = document.getElementById('sound-toggle');
      const show = () => {
        const on = !(window.S3Audio && S3Audio.muted);
        btn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
        btn.setAttribute('aria-pressed', String(on));
      };
      btn.addEventListener('click', () => {
        if (!window.S3Audio) return;
        S3Audio.unlock();
        S3Audio.toggleMute();
        show();
        document.getElementById('game-canvas').focus({ preventScroll: true });
      });
      window.addEventListener('keydown', e => { if (e.code === 'KeyM') setTimeout(show, 0); });
      show();
    })();
  </script>
</body>
</html>
