<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Super 3Sheets</title>
  <meta name="description" content="Super 3Sheets: a tiny NES-style side-scroller. Standalone test page." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --black: #000000;
      --white: #fcfcfc;
      --sky: #5c94fc;
      --gold: #f8b800;
      --red: #d82800;
      --red-dark: #881400;
      --font: 'Press Start 2P', 'Courier New', monospace;
      --px: 4px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      overflow: hidden;
    }

    .game-wrap { width: 100%; max-width: 1600px; }

    #game-canvas {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--sky);
      border: var(--px) solid var(--white);
      cursor: pointer;
      touch-action: manipulation;
    }

    #game-canvas:focus { outline: none; }
    #game-canvas:focus-visible { outline: var(--px) dashed var(--gold); outline-offset: 6px; }

    .game-help { margin: 16px 0 0; font-size: 8px; text-align: center; color: #bcbcbc; line-height: 2; }
    .game-help a { color: var(--gold); }

    .game-touch { display: none; }

    @media (pointer: coarse) {
      .game-touch {
        display: grid;
        grid-template-columns: 64px 64px 1fr 64px 64px;
        grid-template-areas: "left right . run jump";
        gap: 10px;
        margin: 16px auto 0;
        max-width: 560px;
        user-select: none;
        -webkit-user-select: none;
      }
      .game-touch button {
        height: 64px;
        font-family: var(--font);
        font-size: 16px;
        color: var(--white);
        background: var(--black);
        border: var(--px) solid var(--white);
        touch-action: none;
      }
      .game-touch [data-key="left"] { grid-area: left; }
      .game-touch [data-key="right"] { grid-area: right; }
      .game-touch [data-key="run"] { grid-area: run; border-radius: 50%; background: var(--red-dark); }
      .game-touch [data-key="jump"] { grid-area: jump; border-radius: 50%; background: var(--red); }
      .game-touch .is-down { transform: translateY(var(--px)); filter: brightness(0.8); }
      .game-help { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <canvas id="game-canvas" width="256" height="240" tabindex="0" data-fit="screen" data-reserve="110"
      aria-label="Super 3Sheets: a small side-scrolling game. Click or press Enter to start."></canvas>
    <div class="game-touch" aria-hidden="true">
      <button type="button" tabindex="-1" data-key="left">&#9664;</button>
      <button type="button" tabindex="-1" data-key="right">&#9654;</button>
      <button type="button" tabindex="-1" data-key="run">B</button>
      <button type="button" tabindex="-1" data-key="jump">A</button>
    </div>
    <p class="game-help">
      Left/Right run &middot; Z or Space jump &middot; hold X to sprint &middot; P pause<br />
      <a href="index.html">Back to the site</a>
    </p>
  </main>
  <script src="game.js"></script>
  <script>
    // Standalone page: focus the game straight away so keys work.
    document.getElementById('game-canvas').focus({ preventScroll: true });
  </script>
</body>
</html>
